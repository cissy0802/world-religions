name: Inject Shared Scripts

# After any push that touched HTML: 把新页面转成深色配色，并确保每页都带上
# hub 的共享脚本（comments.js + search.js）。跳过自己的 bot commit。

on:
  push:
    branches: [main]
    paths: ['**/*.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 新页面是 routine 生成的，配色由模型自由发挥，默认浅色。深色不靠 prompt 记得，
      # 靠这一步兜住：darken.py 幂等，已经转过的页面会跳过。
      - name: Darken bedtime-reading pages
        run: python3 darken.py

      - name: Inject missing shared script tags
        run: |
          changed=0
          while IFS= read -r f; do
            for script in comments.js search.js index-button.js i18n-tts.js; do
              if ! grep -q "$script" "$f"; then
                tag="<script src=\"https://hub.cissychen.com/$script\" defer></script>"
                if grep -qi "</body>" "$f"; then
                  awk -v tag="$tag" 'BEGIN{IGNORECASE=1} /<\/body>/ && !done { print tag; done=1 } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
                else
                  printf '\n%s\n' "$tag" >> "$f"
                fi
                changed=$((changed+1))
                echo "  + $f ($script)"
              fi
            done
          done < <(find . -name '*.html' -not -path './.git/*' -not -path './node_modules/*')
          echo "Injected $changed tag(s)."

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Auto-process pages (dark theme + shared scripts)"
          # bake-tts 也在改 HTML，两个 workflow 撞车时先 rebase 再推。
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done
